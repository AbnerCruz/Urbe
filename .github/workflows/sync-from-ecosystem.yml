name: sync-from-ecosystem

# A origem é um espelho de distribuição de apps/<produto> do Ecosystem. Ver docs/migration/import-plan.md §7.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-from-ecosystem
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
      pages: write
    env:
      COMPONENT: urbe
      RELEASE_MODE: tag-dispatch
      REQUEST_PAGES_BUILD: '1'
      ECOSYSTEM_REPO: https://github.com/AbnerCruz/Ecosystem.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Sincronizar com o Ecosystem
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q --no-tags "$ECOSYSTEM_REPO" main
          git show FETCH_HEAD:.github/origin-sync/sync-from-ecosystem.sh > "$RUNNER_TEMP/sync.sh"
          bash "$RUNNER_TEMP/sync.sh"
